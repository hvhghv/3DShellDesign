name: Full browser regression

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read

concurrency:
  group: browser-regression
  cancel-in-progress: true

jobs:
  browser-regression:
    name: Full regression (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test browser shard
        run: npm run test:e2e:full -- --shard=${{ matrix.shard }}/2

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-regression-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: test-results/playwright
          if-no-files-found: ignore
          retention-days: 7
